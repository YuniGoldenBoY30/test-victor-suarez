# Apache 2.4 vhost para test.zenixtech.ai (ver docs/DESPLIEGUE.md)
# Requiere: a2enmod proxy proxy_http headers ssl rewrite
# El frontend (nginx del contenedor) se publica solo en 127.0.0.1:8080.
# Sin este vhost, Apache sirve el vhost por defecto (crm.tequenosdubai.com) para este nombre.

<VirtualHost *:80>
    ServerName test.zenixtech.ai

    # Desafío HTTP-01 de Let's Encrypt (certbot --webroot -w /var/www/html)
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>

# El bloque 443 solo se activa cuando existe el certificado, así el primer
# despliegue (antes de certbot) pasa el configtest.
<IfFile /etc/letsencrypt/live/test.zenixtech.ai/fullchain.pem>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName test.zenixtech.ai

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/test.zenixtech.ai/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/test.zenixtech.ai/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/test.zenixtech.ai-error.log
    CustomLog ${APACHE_LOG_DIR}/test.zenixtech.ai-access.log combined
</VirtualHost>
</IfModule>
</IfFile>
