# Apache 2.4 vhost para test.zenixtech.ai (ver docs/DESPLIEGUE.md)
# Requiere: a2enmod proxy proxy_http headers ssl rewrite remoteip
# El frontend (nginx del contenedor) se publica solo en 127.0.0.1:8080.
# Sin este vhost, Apache sirve el vhost por defecto (crm.tequenosdubai.com) para este nombre.

<VirtualHost *:80>
    ServerName test.zenixtech.ai

    # Desafío HTTP-01 de Let's Encrypt (certbot --webroot -w /var/www/html)
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>

# El bloque 443 solo se activa cuando existe el certificado, así el primer
# despliegue (antes de certbot) pasa el configtest.
<IfFile /etc/letsencrypt/live/test.zenixtech.ai/fullchain.pem>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName test.zenixtech.ai

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/test.zenixtech.ai/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/test.zenixtech.ai/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # IP real del cliente. CF-Connecting-IP solo se acepta si la conexión llega
    # desde Cloudflare; si alguien entra directo al origen, cuenta su propia IP.
    # Rangos de https://www.cloudflare.com/ips-v4 y /ips-v6 (2026-11-15).
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    # El backend limita peticiones por esta cabecera (CABECERA_IP_CLIENTE).
    # "set" sobrescribe cualquier valor que envíe el cliente: no se puede falsear.
    RequestHeader set X-Cliente-IP "expr=%{REMOTE_ADDR}"

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Cabeceras para la página HTML (la API ya envía las suyas, más estrictas).
    # "setifempty" no pisa las que vienen del backend; HSTS solo puede ponerlo
    # quien termina TLS, así que va siempre.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty X-Frame-Options "DENY"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"
    Header setifempty Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP en modo informe: Cloudflare inyecta un script en línea (challenge-platform)
    # y la CSP estricta lo bloquearía. Pasar a Content-Security-Policy tras revisar
    # los avisos de la consola del navegador.
    Header setifempty Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    ErrorLog  ${APACHE_LOG_DIR}/test.zenixtech.ai-error.log
    CustomLog ${APACHE_LOG_DIR}/test.zenixtech.ai-access.log combined
</VirtualHost>
</IfModule>
</IfFile>
