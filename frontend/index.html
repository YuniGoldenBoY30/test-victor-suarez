<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Panel de pedidos: ventas por mes y país, mejores clientes y preguntas en lenguaje natural sobre los datos." />
    <meta name="color-scheme" content="light dark" />
    <title>Pedidos: panel y preguntas</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232438c8'/%3E%3Cpath d='M8 22V10h4.5a4 4 0 0 1 0 8H8' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar un parpadeo.
      try {
        var t = localStorage.getItem('tema')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
